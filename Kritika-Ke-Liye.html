<!doctype html><html lang="hi-Latn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0}</style></head><body>
<title>Kritika Ke Liye</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: a two-column ledger. Kritika's words sit on one side, Praveen's reply beside them, separated by hairlines. */
:root {
  --bg: #edf0f5;
  --surface: #f8f9fc;
  --ink: #1b2238;
  --muted: #566080;
  --line: #c9cfdf;
  --accent: #a8305a;
  --on-accent: #ffffff;
  --f-display: 'Newsreader', Georgia, serif;
  --f-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --lh-body: 1.65;
  --lh-display: 1.1;
  --ls-label: 0.12em;
  --quote-style: italic;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1424;
    --surface: #171d33;
    --ink: #e8ebf5;
    --muted: #9aa3c4;
    --line: #2a3253;
    --accent: #ee86a8;
    --on-accent: #0f1424;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1424;
  --surface: #171d33;
  --ink: #e8ebf5;
  --muted: #9aa3c4;
  --line: #2a3253;
  --accent: #ee86a8;
  --on-accent: #0f1424;
  color-scheme: dark;
}

/* Non-Latin scripts need taller lines, no italics and no letter-spacing. */
html:not([data-s="lat"]) {
  --lh-body: 1.85;
  --lh-display: 1.4;
  --ls-label: 0;
  --quote-style: normal;
}
html[data-s="urd"] { --lh-body: 2.25; --lh-display: 1.9; }
html[data-s="arab"] { --lh-body: 1.95; --lh-display: 1.6; }

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  line-height: var(--lh-body);
  -webkit-text-size-adjust: 100%;
}
.page {
  max-width: 1040px;
  margin-inline: auto;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
@media (min-width: 640px) { .page { padding-inline: 32px; } }

/* Header and language picker */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-block: 8px 12px;
}
.brand {
  font-family: var(--f-display);
  font-size: 1.15rem;
  font-weight: 600;
  min-width: 0;
}
.langwrap { position: relative; flex: none; }
.langbtn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: inherit;
  font-size: 0.95rem;
  line-height: 1.4;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
}
.langbtn:hover { border-color: var(--accent); }
.langbtn svg { width: 18px; height: 18px; flex: none; }
.langpanel {
  position: absolute;
  inset-inline-end: 0;
  top: calc(100% + 8px);
  z-index: 10;
  width: min(560px, calc(100vw - 32px));
  max-height: min(70vh, 520px);
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  box-shadow: 0 12px 32px rgba(15, 20, 36, 0.18);
}
.langhead {
  margin: 0 0 12px;
  font-size: 0.78rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.langlist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 6px;
}
.langlist button {
  width: 100%;
  min-height: 44px;
  text-align: start;
  font: inherit;
  font-size: 1rem;
  line-height: 1.5;
  color: var(--ink);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.langlist button:hover { background: var(--bg); }
.langlist button[aria-current="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.langlist .tag {
  font-family: 'Hanken Grotesk', system-ui, sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  flex: none;
}
.draft {
  margin: 20px 0 0;
  padding: 10px 14px;
  font-family: 'Hanken Grotesk', system-ui, sans-serif;
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 6px;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Hero */
.hero { padding-block: clamp(40px, 9vw, 96px) 0; }
.eyebrow {
  margin: 0 0 20px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: var(--ls-label);
  text-transform: uppercase;
  color: var(--accent);
}
h1, h2 {
  font-family: var(--f-display);
  font-weight: 600;
  text-wrap: balance;
  margin: 0;
}
h1 {
  font-size: clamp(2.3rem, 7.4vw, 4.8rem);
  line-height: var(--lh-display);
  letter-spacing: -0.01em;
  max-width: 17ch;
}
html:not([data-s="lat"]) h1 { font-size: clamp(1.9rem, 5.6vw, 3.5rem); letter-spacing: 0; max-width: 20ch; }
.lead {
  margin: 28px 0 0;
  max-width: 56ch;
  font-size: 1.125rem;
  color: var(--muted);
}

main section { margin-top: clamp(56px, 10vw, 104px); }
h2 { font-size: clamp(1.5rem, 3.6vw, 2.1rem); line-height: var(--lh-display); margin-bottom: 28px; }

/* Her words and his reply */
.pair {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
  gap: 12px clamp(24px, 6vw, 72px);
  padding-block: 28px;
  border-top: 1px solid var(--line);
}
.pair:last-child { border-bottom: 1px solid var(--line); }
.her {
  margin: 0;
  font-family: var(--f-display);
  font-style: var(--quote-style);
  font-size: clamp(1.3rem, 2.8vw, 1.6rem);
  line-height: var(--lh-display);
  color: var(--accent);
  text-wrap: balance;
}
.me { margin: 0; font-size: 1.06rem; max-width: 60ch; }
@media (max-width: 720px) { .pair { grid-template-columns: minmax(0, 1fr); } }

/* Letter */
.letter {
  max-width: 64ch;
  padding: clamp(24px, 5vw, 44px);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 3px;
}
.letter p { margin: 0 0 1.1em; font-size: 1.08rem; }
.letter .sign {
  margin: 1.6em 0 0;
  font-family: var(--f-display);
  font-style: var(--quote-style);
  font-size: 1.5rem;
  color: var(--accent);
}

/* Promises */
.vows { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-width: 64ch; }
.vows li {
  display: flex;
  gap: 16px;
  align-items: baseline;
  padding-block: 14px;
  border-top: 1px solid var(--line);
  font-size: 1.1rem;
}
.vows li:last-child { border-bottom: 1px solid var(--line); }
.vows li::before {
  content: "";
  flex: none;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  transform: translateY(-1px);
}

/* Reply */
.reply p { margin: 0 0 18px; max-width: 60ch; color: var(--muted); }
.reply textarea {
  display: block;
  width: 100%;
  max-width: 64ch;
  min-height: 150px;
  resize: vertical;
  font: inherit;
  font-size: 1.05rem;
  line-height: var(--lh-body);
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 14px 16px;
}
.reply textarea::placeholder { color: var(--muted); opacity: 0.8; }
.actions { display: flex; align-items: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
.btn {
  font: inherit;
  font-weight: 600;
  font-size: 1rem;
  color: var(--on-accent);
  background: var(--accent);
  border: 0;
  border-radius: 6px;
  padding: 12px 22px;
  min-height: 46px;
  cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.ghost:hover { background: var(--surface); filter: none; }
a.btn[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }

/* Theme toggle */
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.themebtn {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
}
.themebtn:hover { border-color: var(--accent); }
.themebtn svg { width: 18px; height: 18px; }

/* Choices and sentence starters */
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 8px; }
.chip {
  font: inherit;
  font-size: 1rem;
  line-height: 1.5;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 18px;
  min-height: 44px;
  cursor: pointer;
  text-align: start;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip.small { font-size: 0.95rem; padding: 6px 14px; min-height: 38px; color: var(--muted); }
.starters { margin-bottom: 14px; }
.need .needtext { margin: 0 0 20px; max-width: 60ch; color: var(--muted); }
.answer { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line); max-width: 64ch; }
.answer p { margin: 0 0 4px; font-size: 1.15rem; color: var(--ink); }
.status { color: var(--muted); font-size: 0.92rem; }

/* Page menu and separate pages */
.menu {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-block: 10px;
  border-bottom: 1px solid var(--line);
  scrollbar-width: thin;
}
.menu a {
  flex: none;
  color: var(--muted);
  text-decoration: none;
  padding: 8px 14px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-size: 0.95rem;
  white-space: nowrap;
}
.menu a:hover { color: var(--ink); }
.menu a[aria-current="page"] { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.page-view { padding-top: clamp(32px, 7vw, 64px); }
.page-view h2 { font-size: clamp(1.9rem, 5vw, 3rem); margin-bottom: 32px; }
.page-view section { margin-top: 0; }
.pager { margin-top: 48px; display: flex; justify-content: flex-end; }
.cta { margin: 32px 0 0; }

/* Policy pages */
.doc { padding-top: clamp(32px, 7vw, 64px); }
.doc h1 { font-size: clamp(1.9rem, 5vw, 3rem); max-width: none; margin-bottom: 28px; }
.doc p { max-width: 62ch; font-size: 1.06rem; margin: 0 0 1.2em; }
.back {
  display: inline-block;
  margin-top: 16px;
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
  border-bottom: 1px solid currentColor;
}

/* Footer */
.foot {
  margin-top: clamp(64px, 11vw, 120px);
  padding-top: 20px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  align-items: baseline;
  justify-content: space-between;
  color: var(--muted);
  font-size: 0.92rem;
}
.foot nav { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.foot a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
.foot a:hover { border-color: var(--accent); color: var(--accent); }

/* Motion */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes floatUp { from { transform: translateY(0) scale(.8); opacity: 0; } 12% { opacity: .5; } to { transform: translateY(-110vh) scale(1.1); opacity: 0; } }
@keyframes fall { from { transform: translateY(-40px); } to { transform: translateY(var(--h, 320px)); } }
@keyframes pop { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
@keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.page-view, .doc, .hero { animation: rise .6s ease both; }
.pair, .vows li, .letter p { animation: rise .6s ease both; }
.pair:nth-child(3), .vows li:nth-child(2), .letter p:nth-child(2) { animation-delay: .12s; }
.pair:nth-child(4), .vows li:nth-child(3), .letter p:nth-child(3) { animation-delay: .24s; }
.btn, .chip { transition: transform .15s ease, filter .15s ease, border-color .15s ease; }
.btn:hover, .chip:hover { transform: translateY(-2px); }
.btn:active, .chip:active { transform: scale(.97); }
.drift { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.drift span { position: absolute; bottom: -30px; color: var(--accent); opacity: 0; animation: floatUp linear infinite; }
.page { position: relative; z-index: 1; }

/* Games */
.games { display: grid; gap: 28px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.game h3 { font-family: var(--f-display); font-size: 1.4rem; margin: 0 0 12px; font-weight: 500; }
.gbar { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; color: var(--muted); }
.gbar b { color: var(--accent); font-size: 1.2rem; }
.arena { position: relative; height: 300px; overflow: hidden; border-radius: 12px; border: 1px dashed var(--line); touch-action: manipulation; }
.heart { position: absolute; top: 0; border: 0; background: none; color: var(--accent); font-size: 34px; line-height: 1; padding: 6px; cursor: pointer; animation: fall var(--d, 5s) linear forwards; }
.heart.gone { animation: pop .3s ease forwards; pointer-events: none; }
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 360px; }
.mc { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 1.8rem; cursor: pointer; color: var(--ink); transition: transform .25s ease, background .25s ease; }
.mc .f { display: none; }
.mc.up { background: var(--surface); border-color: var(--accent); transform: rotateY(0) scale(1.04); }
.mc.up .f { display: inline; }
.mc.up .b { display: none; }
.mc.ok { border-color: var(--accent); animation: beat .6s ease; }
.mc .b { color: var(--accent); opacity: .5; }
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pk { min-height: 130px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--accent); font-size: 2rem; cursor: pointer; padding: 12px; font-family: var(--f-body); transition: transform .3s ease; }
.pk.up { background: var(--surface); border-color: var(--accent); color: var(--ink); font-size: .95rem; line-height: 1.45; animation: rise .4s ease both; }
.winline { color: var(--accent); font-weight: 600; min-height: 1.5em; }
@media (max-width: 520px) { .gg.picks { grid-template-columns: 1fr; } .pk { min-height: 70px; } }

@keyframes riseUp { from { transform: translateY(var(--h, 320px)); } to { transform: translateY(-50px); } }
@keyframes flip { 0% { transform: rotateY(0); } 100% { transform: rotateY(1080deg); } }
.heart.up { top: 0; animation-name: riseUp; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 76px; justify-content: center; transition: transform .15s ease, border-color .15s ease; }
.tile:hover { transform: translateY(-3px); border-color: var(--accent); }
.te { font-size: 1.7rem; line-height: 1.1; color: var(--accent); }
.tn { font-size: .78rem; color: var(--muted); }
.sbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.stitle { font-size: 1.4rem; }
.sbody { display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 120px; }
.sbody .arena { width: 100%; }
.sbody .actions { justify-content: center; }
.gg { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 8px; width: 100%; max-width: 360px; }
.gg.picks { max-width: none; }
.cell { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--accent); font-size: 1.5rem; cursor: pointer; font-family: var(--f-body); display: flex; align-items: center; justify-content: center; padding: 0; transition: background .2s ease, transform .15s ease; }
.cell:hover:not(:disabled) { border-color: var(--accent); }
.cell:disabled { color: var(--ink); opacity: 1; }
.cell.blank { visibility: hidden; }
.cell.static { cursor: default; }
.cell.lamp.on, .cell.pad.lit { background: var(--accent); color: var(--on-accent); }
.cell.pad { background: var(--c); border-color: var(--c); opacity: .55; }
.cell.pad.lit { opacity: 1; transform: scale(1.06); background: var(--c); }
.cell.sw { width: 52px; aspect-ratio: 1; border-radius: 50%; }
.cell.bub { border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff8, var(--accent) 140%); opacity: .8; }
.cell.popped { opacity: .15; transform: scale(.7); pointer-events: none; }
.big { font-family: var(--f-display); font-size: 2.2rem; margin: 0; text-align: center; color: var(--ink); }
.big.hearts { color: var(--accent); font-size: 1.8rem; }
.btn.big { font-size: 1.8rem; min-width: 76px; }
.num { width: 90px; font: inherit; font-size: 1.3rem; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); text-align: center; }
.coin { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--accent); background: var(--surface); color: var(--accent); font-size: 3rem; cursor: pointer; }
.coin.flip { animation: flip .9s ease; }
.bigheart { background: none; border: 0; color: var(--accent); font-size: 7rem; line-height: 1; cursor: pointer; padding: 0; }
.beat { animation: beat .35s ease; }
.bar { width: 100%; max-width: 320px; height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
.wheel { width: 150px; height: 150px; border-radius: 50%; border: 6px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--accent); background: conic-gradient(var(--surface) 0 25%, var(--bg) 0 50%, var(--surface) 0 75%, var(--bg) 0); transition: transform 1.6s cubic-bezier(.2,.8,.2,1); }
.ball { width: 140px; height: 140px; border-radius: 50%; background: #1b2238; color: #fff; font-size: 3rem; border: 4px solid var(--accent); cursor: pointer; font-family: var(--f-display); }
.oracle { min-height: 3em; text-align: center; max-width: 36ch; margin: 0; color: var(--ink); }
.swatch { width: 140px; height: 90px; border-radius: 14px; border: 1px solid var(--line); }
.react { width: 100%; max-width: 360px; height: 160px; border-radius: 16px; border: 0; background: var(--line); color: var(--ink); font-size: 2rem; cursor: pointer; }
.react.go { background: var(--accent); color: var(--on-accent); }
.pad { width: 100%; max-width: 600px; aspect-ratio: 5 / 3; border: 1px dashed var(--line); border-radius: 12px; touch-action: none; background: #fff; }
.flower { font-size: 5rem; }

.heart svg, .te svg, .si svg, .cell svg, .mc svg, .bigglyph svg, .bigheart svg, .coin svg, .wheel svg, .pk svg, .big svg, .ic svg, .react svg, .sw svg, .diyab svg, .chime svg, .sticker svg, .fall svg, .bask svg, .under svg { width: 1em; height: 1em; display: block; }
.heart svg { width: 1em; height: 1em; }
.te svg { width: 30px; height: 30px; }
.si svg { width: 26px; height: 26px; display: inline-block; vertical-align: -5px; color: var(--accent); }
.cell svg { width: 62%; height: 62%; }
.mc svg { width: 1.7rem; height: 1.7rem; margin: auto; }
.mc .b svg { width: 1.2rem; height: 1.2rem; }
.pk svg { width: 2rem; height: 2rem; margin: auto; }
.bigheart svg { width: 7rem; height: 7rem; }
.coin svg { width: 3rem; height: 3rem; margin: auto; }
.wheel svg { width: 3rem; height: 3rem; }
.react svg { width: 2.4rem; height: 2.4rem; margin: auto; }
.sw svg { width: 60%; height: 60%; }
.bigglyph { background: none; border: 0; cursor: pointer; color: var(--accent); padding: 0; }
.bigglyph svg { width: 8rem; height: 8rem; }
.btn.big2 { font-size: 1.5rem; min-width: 70px; }
.ic { display: inline-block; width: 2rem; height: 2rem; margin: 3px; color: var(--accent); }
.ic svg { width: 100%; height: 100%; }

<script>
(function () {
  var STORE = 'kritika-lang';
  // c: code, n: name in its own language, s: script, rtl, d: draft translation
  var LANGS = [
    { c: 'hl', n: 'Hinglish', s: 'lat', tag: 'hi-Latn' },
    { c: 'en', n: 'English', s: 'lat', tag: 'en' },
    { c: 'as', n: 'অসমীয়া', s: 'ben', tag: 'as' },
    { c: 'bn', n: 'বাংলা', s: 'ben', tag: 'bn' },
    { c: 'brx', n: 'बड़ो', s: 'dev', tag: 'brx', d: 1 },
    { c: 'doi', n: 'डोगरी', s: 'dev', tag: 'doi', d: 1 },
    { c: 'gu', n: 'ગુજરાતી', s: 'guj', tag: 'gu' },
    { c: 'hi', n: 'हिन्दी', s: 'dev', tag: 'hi' },
    { c: 'kn', n: 'ಕನ್ನಡ', s: 'kan', tag: 'kn' },
    { c: 'ks', n: 'کٲشُر', s: 'arab', tag: 'ks', rtl: 1, d: 1 },
    { c: 'kok', n: 'कोंकणी', s: 'dev', tag: 'kok', d: 1 },
    { c: 'mai', n: 'मैथिली', s: 'dev', tag: 'mai', d: 1 },
    { c: 'ml', n: 'മലയാളം', s: 'mal', tag: 'ml' },
    { c: 'mni', n: 'ꯃꯩꯇꯩꯂꯣꯟ', s: 'mei', tag: 'mni', d: 1 },
    { c: 'mr', n: 'मराठी', s: 'dev', tag: 'mr' },
    { c: 'ne', n: 'नेपाली', s: 'dev', tag: 'ne' },
    { c: 'or', n: 'ଓଡ଼ିଆ', s: 'ori', tag: 'or' },
    { c: 'pa', n: 'ਪੰਜਾਬੀ', s: 'pan', tag: 'pa' },
    { c: 'sa', n: 'संस्कृतम्', s: 'dev', tag: 'sa' },
    { c: 'sat', n: 'ᱥᱟᱱᱛᱟᱲᱤ', s: 'olc', tag: 'sat', d: 1 },
    { c: 'sd', n: 'سنڌي', s: 'arab', tag: 'sd', rtl: 1, d: 1 },
    { c: 'ta', n: 'தமிழ்', s: 'tam', tag: 'ta' },
    { c: 'te', n: 'తెలుగు', s: 'tel', tag: 'te' },
    { c: 'ur', n: 'اردو', s: 'urd', tag: 'ur', rtl: 1 }
  ];
  // [display face, body face]; a missing display face reuses the body face
  var SCR = {
    lat: null,
    dev: [null, 'Noto Sans Devanagari'],
    ben: [null, 'Noto Sans Bengali'],
    guj: [null, 'Noto Sans Gujarati'],
    kan: [null, 'Noto Sans Kannada'],
    mal: [null, 'Noto Sans Malayalam'],
    tam: [null, 'Noto Sans Tamil'],
    tel: [null, 'Noto Sans Telugu'],
    pan: [null, 'Noto Sans Gurmukhi'],
    ori: [null, 'Noto Sans Oriya'],
    urd: [null, 'Noto Nastaliq Urdu'],
    arab: [null, 'Noto Naskh Arabic'],
    olc: [null, 'Noto Sans Ol Chiki'],
    mei: [null, 'Noto Sans Meetei Mayek']
  };
  var DISPLAY = {
    dev: 'Noto Serif Devanagari', ben: 'Noto Serif Bengali', guj: 'Noto Serif Gujarati',
    kan: 'Noto Serif Kannada', mal: 'Noto Serif Malayalam', tam: 'Noto Serif Tamil',
    tel: 'Noto Serif Telugu', pan: 'Noto Serif Gurmukhi'
  };

  var root = document.documentElement;
  var $ = function (id) { return document.getElementById(id); };
  var current = 'hl';

  function read() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function write(v) { try { localStorage.setItem(STORE, v); } catch (e) {} }
  function find(c) { for (var i = 0; i < LANGS.length; i++) if (LANGS[i].c === c) return LANGS[i]; return null; }
  function link(id, href) {
    if (document.getElementById(id)) return;
    var l = document.createElement('link');
    l.id = id; l.rel = 'stylesheet'; l.href = href;
    document.head.appendChild(l);
  }
  function fam(n) { return 'family=' + n.replace(/ /g, '+'); }

  function setFonts(s) {
    root.setAttribute('data-s', s);
    var f = SCR[s];
    if (!f) { root.style.removeProperty('--f-display'); root.style.removeProperty('--f-body'); return; }
    var body = f[1], disp = DISPLAY[s] || body;
    root.style.setProperty('--f-display', "'" + disp + "','Newsreader',serif");
    root.style.setProperty('--f-body', "'" + body + "','Hanken Grotesk',system-ui,sans-serif");
    var names = disp === body ? [body] : [disp, body];
    link('fnt-' + s, 'https://fonts.googleapis.com/css2?' + names.map(function (n) { return fam(n) + ':wght@400;700'; }).join('&') + '&display=swap');
  }

  function apply(code) {
    var lang = find(code) || find('hl');
    current = lang.c;
    var dict = window.I18N[current] || window.I18N.hl;
    var base = window.I18N.hl;
    root.setAttribute('lang', lang.tag);
    root.setAttribute('dir', lang.rtl ? 'rtl' : 'ltr');
    setFonts(lang.s);
    Array.prototype.forEach.call(document.querySelectorAll('[data-i]'), function (el) {
      var k = el.getAttribute('data-i');
      el.textContent = dict[k] || base[k] || '';
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ph]'), function (el) {
      var k = el.getAttribute('data-ph');
      el.setAttribute('placeholder', dict[k] || base[k] || '');
    });
    $('langName').textContent = lang.n;
    $('draftNote').hidden = !lang.d;
    $('copyMsg').textContent = '';
    $('needMsg').textContent = '';
    updateNeed();
    if (window.refreshGames) refreshGames();
    Array.prototype.forEach.call($('langList').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-current', b.getAttribute('data-c') === current ? 'true' : 'false');
    });
    write(current);
  }

  function buildList() {
    var ul = $('langList');
    var groups = {};
    LANGS.forEach(function (lang) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('data-c', lang.c);
      b.setAttribute('lang', lang.tag);
      b.setAttribute('dir', lang.rtl ? 'rtl' : 'ltr');
      var f = SCR[lang.s];
      if (f) {
        b.style.fontFamily = "'" + f[1] + "', system-ui, sans-serif";
        (groups[f[1]] = groups[f[1]] || []).push(lang.n);
      }
      var name = document.createElement('span');
      name.textContent = lang.n;
      b.appendChild(name);
      if (lang.d) {
        var t = document.createElement('span');
        t.className = 'tag'; t.textContent = 'draft';
        b.appendChild(t);
      }
      b.addEventListener('click', function () { apply(lang.c); closePanel(); $('langBtn').focus(); });
      li.appendChild(b);
      ul.appendChild(li);
    });
    // small subsets so every language name renders even before its page font loads
    Object.keys(groups).forEach(function (face, i) {
      link('nm-' + i, 'https://fonts.googleapis.com/css2?' + fam(face) + '&text=' + encodeURIComponent(groups[face].join('')) + '&display=swap');
    });
  }

  function openPanel() { $('langPanel').hidden = false; $('langBtn').setAttribute('aria-expanded', 'true'); }
  function closePanel() { $('langPanel').hidden = true; $('langBtn').setAttribute('aria-expanded', 'false'); }

  var VIEWS = ['home', 'say', 'letter', 'vows', 'need', 'reply', 'games', 'privacy', 'terms'];
  function route() {
    var h = (location.hash || '').replace('#', '');
    var v = VIEWS.indexOf(h) > -1 ? h : 'home';
    VIEWS.forEach(function (n) { $('view-' + n).hidden = n !== v; });
    Array.prototype.forEach.call($('menu').querySelectorAll('a'), function (a) {
      if (a.getAttribute('data-p') === v) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
    if (v !== 'games' && window.arcadeLeave) window.arcadeLeave();
  }

  var need = 0;
  function t(k) {
    var d = window.I18N[current] || window.I18N.hl;
    return d[k] || window.I18N.hl[k] || '';
  }
  // A chat button copies the text first, then its link opens Praveen's chat site in a new tab.
  function chatClick(getText, statusEl) {
    return function () {
      var text = getText();
      if (text) copyText(text, statusEl, null, 'chatHint');
    };
  }
  function updateNeed() {
    Array.prototype.forEach.call($('needChips').querySelectorAll('.chip'), function (b) {
      b.setAttribute('aria-pressed', Number(b.getAttribute('data-n')) === need ? 'true' : 'false');
    });
    $('answerText').textContent = t('r' + (need + 1));
  }
  function copyText(text, statusEl, fieldEl, msgKey) {
    function done() {
      statusEl.textContent = t(msgKey || 'copied');
      setTimeout(function () { statusEl.textContent = ''; }, 2400);
    }
    function fallback() {
      var ta = fieldEl, temp = false;
      if (!ta) {
        ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        temp = true;
      }
      ta.focus(); ta.select();
      try { if (document.execCommand('copy')) done(); } catch (e) {}
      if (temp) document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  }
  function copyReply() {
    var box = $('replyBox');
    var text = box.value.trim();
    if (!text) { box.focus(); return; }
    copyText(text, $('copyMsg'), box);
  }

  $('langBtn').addEventListener('click', function () { $('langPanel').hidden ? openPanel() : closePanel(); });
  document.addEventListener('click', function (e) {
    if (!$('langPanel').hidden && !e.target.closest('.langwrap')) closePanel();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('langPanel').hidden) { closePanel(); $('langBtn').focus(); }
  });
  $('copyBtn').addEventListener('click', copyReply);
  Array.prototype.forEach.call($('needChips').querySelectorAll('.chip'), function (b) {
    b.addEventListener('click', function () {
      need = Number(b.getAttribute('data-n'));
      $('needMsg').textContent = '';
      updateNeed();
    });
  });
  $('needCopy').addEventListener('click', function () { copyText(t('c' + (need + 1)), $('needMsg')); });
  Array.prototype.forEach.call($('starters').querySelectorAll('.chip'), function (b) {
    b.addEventListener('click', function () {
      var box = $('replyBox');
      var cur = box.value.replace(/\s+$/, '');
      box.value = cur ? cur + '\n' + b.textContent + ' ' : b.textContent + ' ';
      box.focus();
      box.setSelectionRange(box.value.length, box.value.length);
    });
  });
  $('needChat').addEventListener('click', chatClick(function () { return t('c' + (need + 1)); }, $('needMsg')));
  $('replyChat').addEventListener('click', chatClick(function () { return $('replyBox').value.trim(); }, $('copyMsg')));

  var TK = 'kritika-theme';
  function setTheme(v) { if (v) root.setAttribute('data-theme', v); else root.removeAttribute('data-theme'); }
  try { var saved = localStorage.getItem(TK); if (saved === 'dark' || saved === 'light') setTheme(saved); } catch (e) {}
  $('themeBtn').addEventListener('click', function () {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var cur = root.getAttribute('data-theme') || (dark ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    setTheme(next);
    try { localStorage.setItem(TK, next); } catch (e) {}
  });
  window.addEventListener('hashchange', route);

  // Floating hearts in the background (decorative)
  (function () {
    var d = $('drift');
    for (var i = 0; i < 9; i++) {
      var s = document.createElement('span');
      s.textContent = '\u2665';
      s.style.left = (6 + i * 11) + '%';
      s.style.fontSize = (14 + (i % 4) * 6) + 'px';
      s.style.animationDuration = (16 + (i % 5) * 4) + 's';
      s.style.animationDelay = (i * 2.3) + 's';
      d.appendChild(s);
    }
  })();


  window.__t = t;
  buildList();
  apply(read() || 'hl');
  route();
})();
</script>
